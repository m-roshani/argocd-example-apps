apiVersion: batch/v1
kind: Job
metadata:
  name: presync-job
spec:
  template:
    spec:
      containers:
      - name: migration-container
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Running database migrations..."
          sleep 10
          echo "Migrations completed successfully!"
      restartPolicy: Never
  backoffLimit: 4
